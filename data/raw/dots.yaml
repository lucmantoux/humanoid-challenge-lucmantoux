  2: [37.0, 40.0]
  3: [52.0, 40.0]
  4: [22.0, 25.0]
  5: [37.0, 25.0]
  6: [52.0, 25.0]
  7: [22.0, 10.0]
  8: [37.0, 10.0]
  9: [52.0, 10.0]
