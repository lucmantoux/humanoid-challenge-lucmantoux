# Positions of the 9 taped dots, in centimetres, in the table frame T.
# T has its origin at the ORIGIN corner of the printed ArUco board, x to the right and
# y away from the phone (see docs/FILMING_GUIDE.md Step 2).
#
# These are the positions the filming guide tells you to tape, so they are correct by
# construction. If you had to move anything, measure it and edit the numbers here.
# The extraction pipeline cross-checks them against the vision measurements and reports
# the disagreement; anything under 2 cm is fine.

dots:
